<div id="quiz-container" style="padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
    <h3>퀴즈 정답 제출</h3>
    <input type="text" id="quizNo" placeholder="문제 번호 ex. 초록 1">
    <input type="text" id="answer" placeholder="정답 입력">
    <button onclick="submitQuiz()">제출하기</button>
    <p id="msg" style="margin-top: 10px; font-weight: bold;"></p>
</div>

<script>
    function submitQuiz() {
        const url = "https://script.google.com/macros/s/AKfycbwgrPRP7MDe3InnWoVeMDxDK9TKoHK6iIk8rBLTJjUtP2ANnzb_hf1ZWMwcweoxuMPG/exec";
        const no = document.getElementById('quizNo').value;
        const ans = document.getElementById('answer').value;
        const msg = document.getElementById('msg');

        if(!no || !ans) {
            alert("문제 번호와 정답을 모두 입력해주세요.");
            return;
        }

        msg.innerText = "채점 중...";

        // CORS 오류를 방지하기 위해 GET 방식으로 호출하는 것을 추천합니다.
        fetch(`${url}?no=${encodeURIComponent(no)}&answer=${encodeURIComponent(ans)}`)
        .then(res => res.text())
        .then(data => {
            if (data.includes("정답")) {
                alert("🎉 축하합니다! 정답입니다.");
                msg.style.color = "blue";
                msg.innerText = "최근 결과: 정답 ✅";
            } else {
                alert("❌ 틀렸습니다. 다시 생각해보세요!");
                msg.style.color = "red";
                msg.innerText = "최근 결과: 오답 ❌";
            }
            document.getElementById('answer').value = "";
        })
        .catch(err => {
            msg.innerText = "전송 오류가 발생했습니다. (설정을 확인하세요)";
        });
    }
</script>
